<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>For Ellyanna ♡</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 20%,#fff8fa,#f4dbe5 85%);font-family:Georgia,serif;color:#78475e;display:flex;align-items:center;justify-content:center;overflow:hidden}.app{height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 10px 18px}.heading{font-size:clamp(17px,4vw,25px);font-style:italic;text-align:center;flex-shrink:0}.book-wrap{width:min(94vw,calc((100dvh - 155px)*.704),520px);aspect-ratio:692/983;perspective:1700px;position:relative;touch-action:pan-y;flex-shrink:1;min-height:0}.book{position:absolute;inset:0;border-radius:3px;box-shadow:12px 18px 35px #70455c50,3px 2px 0 #fff9;transform-style:preserve-3d;background:white;overflow:visible}.page,.flip{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;border-radius:2px;user-select:none;-webkit-user-drag:none}.page{z-index:1}.flip{z-index:3;transform-origin:left center;backface-visibility:hidden;box-shadow:inset -12px 0 15px #0001}.flip.forward{animation:turnForward .65s ease-in-out forwards}.flip.backward{transform-origin:right center;animation:turnBackward .65s ease-in-out forwards}@keyframes turnForward{0%{transform:rotateY(0deg);opacity:1}75%{opacity:.9}100%{transform:rotateY(-180deg);opacity:0}}@keyframes turnBackward{0%{transform:rotateY(0deg);opacity:1}75%{opacity:.9}100%{transform:rotateY(180deg);opacity:0}}.controls{display:flex;gap:16px;align-items:center;justify-content:center;flex-shrink:0}.controls button{background:#fffafc;border:1px solid #e8b6cb;border-radius:30px;padding:10px 18px;color:#7b4862;font-size:15px;cursor:pointer;box-shadow:0 3px 10px #9b57731a}.controls button:disabled{opacity:.35;cursor:default}.count{font-size:14px;min-width:62px;text-align:center}.hint{font-size:12px;opacity:.7;text-align:center;flex-shrink:0}@media(prefers-reduced-motion:reduce){.flip.forward,.flip.backward{animation-duration:.05s}}</style></head><body><main class="app"><div class="heading">For my dearest Ellyanna ♡</div><div class="book-wrap" id="touch"><div class="book" id="book"><img class="page" id="page" alt="Birthday book page" draggable="false"></div></div><div class="controls"><button id="prev" type="button" aria-label="Previous page">❮ Previous</button><span class="count" id="count"></span><button id="next" type="button" aria-label="Next page">Next ❯</button></div><div class="hint">Swipe left or right to turn the pages ♡</div></main><script>
'use strict';const files=Array.from({length:8},(_,i)=>'pages/page-'+String(i+1).padStart(2,'0')+'.jpg');const page=document.getElementById('page'),book=document.getElementById('book'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');let index=0,busy=false;function refresh(){page.src=files[index];page.alt='Page '+(index+1)+' of '+files.length;count.textContent=(index+1)+' / '+files.length;prev.disabled=index===0;next.disabled=index===files.length-1}function turn(direction){if(busy)return;let target=index+direction;if(target<0||target>=files.length)return;busy=true;let old=files[index];index=target;refresh();let overlay=document.createElement('img');overlay.src=old;overlay.className='flip '+(direction>0?'forward':'backward');overlay.alt='';overlay.draggable=false;book.appendChild(overlay);let finish=()=>{overlay.remove();busy=false};overlay.addEventListener('animationend',finish,{once:true});setTimeout(()=>{if(overlay.isConnected)finish()},900)}prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let x=null,y=null;const touch=document.getElementById('touch');touch.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});touch.addEventListener('touchend',e=>{if(x===null)return;let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)turn(dx<0?1:-1);x=null;y=null},{passive:true});refresh();files.forEach(src=>{let img=new Image();img.src=src});</script></body></html>
